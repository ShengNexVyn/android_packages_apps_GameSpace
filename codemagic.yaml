workflows:
  android-release:
    name: NexPlay Android (Release APK - signed)
    max_build_duration: 60
    # Untuk native Android, linux_x86_64 biasanya lebih cepat & murah, 
    # tapi tetap pakai mac_mini_m2 di sini sesuai versi aslinya.
    instance_type: mac_mini_m2 
    environment:
      java: 17 # Sesuaikan dengan versi Java di project kamu (biasanya 11 atau 17)
      vars:
        PACKAGE_NAME: "vloxa.gamespace.app"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Make gradlew executable
        script: |
          chmod +x ./gradlew
      - name: Build Release APK
        script: |
          # Perintah ini akan mem-build APK Release. 
          # Jika project kamu pakai split per ABI, konfigurasinya harus diset di build.gradle
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
